<!doctype html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Selector</title>
    <style>
        h1, p, h2 {
            text-align:center;
            color:red;
            font-size:200%;
        }

    </style>
</head>
<body>

    <h1>CSS Group Selector</h1>
    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>
    <h2>Niya's Friends</h2>
    <ul>
        <li>Nakiri</li>
        <li>Meghana</li>
        <li>Michelle</li>
        <li>Akshara</li>
        <li>Ethan</li>
        <li>Alissa</li>
        <li>Crystal</li>
    </ul>

</body>
</html>
